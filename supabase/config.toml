# Supabase project config for Co-Exist.
#
# WHY THIS FILE EXISTS (2026-08-26): with no config.toml, a bare
# `supabase functions deploy <slug>` applies the CLI DEFAULT verify_jwt=true.
# On 2026-08-26T02:27Z that silently flipped stripe-webhook to true and every
# live Stripe delivery was rejected 401 at the gateway before the function body
# ran, so purchases took money and wrote no ticket. Pinning every function here
# makes the deploy flag-independent: the declared value below always wins.
#
# This project issues ES256 asymmetric JWTs that the Supabase API gateway does
# not verify correctly, so functions do their own auth (see scripts/deploy-fn.sh).
# Third-party callbacks MUST stay false - Stripe and Resend cannot present a JWT;
# they authenticate by signature instead (stripe-webhook: constructEventAsync).

project_id = "tjutlbzekfouwsiaplbr"

[functions.cancel-event]
verify_jwt = true

[functions.carpool-archive-sweep]
verify_jwt = false

