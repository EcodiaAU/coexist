<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>Co-Exist | Explore. Connect. Protect.</title>
    <meta name="description" content="Australia's youth conservation platform. Join local events, connect with collectives, plant native trees, clean beaches, and track your real-world environmental impact." />

    <!-- Theme & PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B4332" />
    <!-- Force light color scheme. Without this Android WebView's algorithmic
         darkening can invert the splash bg (#fafaf8 -> dark) on devices where
         the user has system dark mode on. The app is light-only by design. -->
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Co-Exist" />
    <meta name="apple-mobile-web-app-title" content="Co-Exist" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Default OG (overridden per-page) -->
    <meta property="og:site_name" content="Co-Exist" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:type" content="website" />
  </head>
  <body style="background-color:#f8f9f5">
    <!--
      Pre-React boot cover. The system splash (Android 12+ Theme.SplashScreen /
      iOS LaunchScreen) is torn down as soon as the WebView is ready, and
      SplashScreen.hide() runs at module scope in main.tsx - but the in-app
      SplashPage cannot render until React has mounted and painted. Nothing
      covered the window between those two moments, so the WebView showed an
      empty near-white body. On a fast device that gap is a blink; on a loaded
      or low-end device it is a long blank screen, and it is the frame that got
      read as a "white screen crash" on 2026-07-14 (the signed-out Android
      cold start was reported as an infinite auth loop; the app was simply
      still painting). This markup ships in the initial document, so it paints
      as soon as the WebView parses HTML - no bundle parse, no JS execution,
      no network. App.tsx removes it on mount.

      DELIBERATELY TEXT-FREE. The Maestro auth flows assert on visible text
      ("Welcome", "Co-Exist", "Sign in"...). A boot cover carrying any of those
      words could satisfy an assertion while the app was still booting and turn
      a real regression into a false GREEN. The mark is an image; aria-hidden
      keeps it out of the accessibility tree Maestro reads.
    -->
    <!--
      The mark MUST match src/pages/splash.tsx exactly (same image, same size,
      same bg, static) so the native splash -> this boot cover -> the React
      SplashPage read as ONE continuous splash. Do NOT swap in the circled
      logomark here: it is a different, retired brand mark, and it made the boot
      cover look like a distinct second splash (Tate 2026-07-15).
    -->
    <div id="boot-splash" aria-hidden="true">
      <img src="/logos/black-wordmark.png" alt="" />
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf8;
        /* Below the boot-error overlay (99999) so a real boot error still
           paints over this, never under it. */
        z-index: 9998;
      }
      #boot-splash img {
        /* Identical to SplashPage: w-[60vw] max-w-[280px] h-auto */
        width: 60vw;
        max-width: 280px;
        height: auto;
        object-fit: contain;
      }
    </style>
    <div id="root"></div>
    <!--
      Synchronous boot-error overlay. Diagnostic for the 1.8.13-1.8.16
      iOS white-screen. Registered BEFORE the module script loads, so
      any error during module-level evaluation (the dominant suspect
      after lazy app-version refactor didn't fix it) lands on screen
      instead of leaving the WebView blank.
    -->
    <script>
      (function () {
        // Build-time env injection: Vite replaces the percent-wrapped env
        // names below at build time. If one is undefined, Vite leaves the
        // placeholder literal, which is exactly the diagnostic we want.
        // (Do not write a percent-wrapped VITE_ name in this comment: the
        // build guard and the OTA artifact gate both fail on any that
        // survives into dist, and a comment would trip them.)
        // Console/devtools diagnostics ONLY: the overlay below must never paint
        // these fields. Keep the url line: the OTA artifact gate in
        // scripts/ship-web-ota.sh greps dist/index.html for the Supabase host,
        // and this is the line that puts it there.
        window.__DEBUG_BOOT = {
          url: '%VITE_SUPABASE_URL%',
          keyPrefix: '%VITE_SUPABASE_ANON_KEY%'.slice(0, 24),
          mode: '%MODE%',
          time: new Date().toISOString(),
        };
        // Scope: visible overlay only paints during the boot window. After 5s
        // (or once React signals window.__APP_MOUNTED = true) the overlay
        // mutes itself and any further errors land in console only. Without
        // this, a transient post-mount error (e.g. Realtime channel hiccup,
        // network blip) paints a white overlay across a working app - the
        // exact symptom of the 1.8.21 Supabase Realtime double-join.
        var BOOT_WINDOW_MS = 5000;
        var paintsAllowed = true;
        setTimeout(function () { paintsAllowed = false; }, BOOT_WINDOW_MS);
        // Stale-deploy self-heal (COEXIST-Q, 23 Jul 2026): after a deploy
        // rotates the Vite chunk hashes, a device holding the old shell
        // (SW-cached HTML or a long-open PWA tab) requests a dead chunk and
        // Safari surfaces "Importing a module script failed" as an
        // unhandledrejection. One reload fetches fresh HTML (the SW's
        // navigation handler is network-first) and fully recovers, so we
        // reload ONCE per session instead of painting the diagnostic overlay
        // at the user. Shares lazy-with-retry's sessionStorage guard key
        // (cleared by clearChunkReloadGuard once a fresh entry mounts), so
        // the loop-guard semantics are one system: guard set -> reload ->
        // fresh entry loads -> guard cleared. If the reload lands on the same
        // error (a real outage, not a stale shell) the guard is still set,
        // recovery stands down, and the overlay paints as before.
        var CHUNK_ERR = /Importing a module script failed|dynamically imported module|Loading chunk|Unable to preload CSS/i;
        var CHUNK_GUARD_KEY = 'coexist-chunk-reload-attempted';
        // COEXIST-J: a benign @supabase/auth-js lock-steal recovery. auth-js drives
        // token refresh through navigator.locks and recovers a stuck lock with
        // {steal:true}; the displaced holder's AbortSignal rejects with Chromium's
        // "Lock broken by another request with the 'steal' option." (older wordings
        // below). On an authed deep route it can fire as an unhandledrejection inside
        // the 5s boot window and before __APP_MOUNTED - slipping past BOTH paint
        // guards - which would paint the diagnostic overlay over a working app (the
        // same failure the post-mount/5s guards exist to prevent). It is not a boot
        // failure: log it, never paint. Sentry drops it at beforeSend too
        // (src/lib/sentry.tsx LOCK_SIGNATURE). Sentry issue 7616268242.
        var BENIGN_LOCK = /Navigator LockManager|navigatorLock|LockAcquireTimeout|another request stole it|Lock broken by another request/i;
        // Meta in-app browser (Instagram / Facebook) injected-script errors. The
        // IAB injects its own inline script into OUR document and that script reads
        // window._META.IABInnerFrame without checking _META exists. It throws inside
        // the boot window, so on 2026-10-31 an event invite link shared on an
        // Instagram story opened to a full-screen white overlay instead of the event,
        // with the event page fully rendered underneath it. The throw is attributed
        // to our own page URL (line 1), so a "not our origin" filename check cannot
        // catch it; the Meta-only symbol names are the signature. The frame names
        // mirror INJECTED_BRIDGE_FRAMES in src/lib/sentry.tsx (Meta's native bridge
        // script). None of these symbols exist in Co-Exist source or in Capacitor's
        // native bridge. Not ours, not a boot failure: log it, never paint.
        var FOREIGN_IAB = /IABInnerFrame|\b_META\b|sendDataToNative|sendPageHideMessage|_AutofillCallbackHandler/;
        function chunkRecover(payload) {
          try {
            var msg = typeof payload === 'string' ? payload : (payload && payload.message) || '';
            if (!CHUNK_ERR.test(msg)) return false;
            if (sessionStorage.getItem(CHUNK_GUARD_KEY)) return false;
            sessionStorage.setItem(CHUNK_GUARD_KEY, '1');
            window.location.reload();
            return true;
          } catch (e) { return false; }
        }
        function paint(label, payload) {
          if (chunkRecover(payload)) return;
          try {
            var lockMsg = typeof payload === 'string' ? payload : (payload && (payload.message || payload.name)) || '';
            if (BENIGN_LOCK.test(lockMsg)) { try { console.error('[boot-error:benign-lock-skip]', label, lockMsg); } catch (e) { /* ignore */ } return; }
            var iabText = lockMsg + ' ' + ((payload && typeof payload !== 'string' && payload.stack) || '');
            if (FOREIGN_IAB.test(iabText)) { try { console.error('[boot-error:foreign-iab-skip]', label, lockMsg); } catch (e) { /* ignore */ } return; }
          } catch (e) { /* fall through to normal handling */ }
          var headForLog = '';
          try {
            if (typeof payload === 'string') headForLog = payload;
            else if (payload) headForLog = (payload.name ? payload.name + ': ' : '') + (payload.message ? payload.message : String(payload));
          } catch (e) { headForLog = String(payload); }
          try { console.error('[boot-error]', label, headForLog, payload); } catch (e) { /* ignore */ }
          if (!paintsAllowed || window.__APP_MOUNTED) return;
          try {
            var div = document.getElementById('boot-error');
            if (!div) {
              div = document.createElement('div');
              div.id = 'boot-error';
              div.style.cssText = 'position:fixed;inset:0;background:#fff;color:#000;padding:20px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:99999;line-height:1.4';
              // Never print window.__DEBUG_BOOT here. The env block it used to dump
              // (Supabase url + anon key prefix) read to a user as a credential leak
              // on 2026-10-31. It stays readable from devtools, which is enough.
              div.textContent = 'Co-Exist could not start. Reload the page to try again.\n---\n';
              document.body.appendChild(div);
            }
            var head = '';
            var stack = '';
            if (typeof payload === 'string') {
              head = payload;
            } else if (payload) {
              try { head = (payload.name || 'Error') + ': ' + (payload.message || String(payload)); } catch (e) { head = String(payload); }
              try { stack = payload.stack || ''; } catch (e) { stack = ''; }
              if (stack && stack.indexOf(head) === 0) stack = stack.slice(head.length).replace(/^\n/, '');
            } else {
              head = String(payload);
            }
            div.textContent = (div.textContent || '') + '\n[' + label + '] ' + head + (stack ? '\n  ' + stack.split('\n').join('\n  ') : '') + '\n';
          } catch (e) { /* last resort */ }
        }
        window.addEventListener('error', function (e) { paint('error', e.error || e.message || e); });
        window.addEventListener('unhandledrejection', function (e) { paint('promise', e.reason); });
        window.__bootError = paint;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
