# Admin -> Applications. Hero + TOTAL/PENDING/ACCEPTED cards +
# Applications/Notifications subtabs. Empty-state safe.
appId: org.coexistaus.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    commands:
      - stopApp
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
- openLink: "coexist://admin/applications"
- extendedWaitUntil:
    visible: "Applications"
    timeout: 15000
# The TOTAL/PENDING/ACCEPTED metric cards were removed in the admin redesign (no
# such literals remain in src/pages/admin/applications.tsx). The always-present
# shell is the Applications/Notifications subtab pair (applications.tsx:190-191).
- assertVisible: "Notifications"
- takeScreenshot: /tmp/maestro-cx-admin-applications
