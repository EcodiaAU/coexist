# Admin -> Updates. Hero + New Update CTA + TOTAL/PINNED/URGENT/TARGETED
# metric cards + All/National/Collective filter pills.
appId: org.coexistaus.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    commands:
      - stopApp
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
- openLink: "coexist://admin/updates"
- extendedWaitUntil:
    visible: "New Update"
    timeout: 15000
# The TOTAL/PINNED/URGENT/TARGETED metric cards were removed in the admin-updates
# redesign (no such literals remain in src/pages/admin/updates.tsx, and the empty
# page renders title + New Update + search + filter pills + "No updates found",
# verified 2026-08-18 hw-GPU). Assert only the always-present shell anchors.
- assertVisible: ".*Search updates.*"
- assertVisible: "National"
- assertVisible: "Collective"
- takeScreenshot: /tmp/maestro-cx-admin-updates
