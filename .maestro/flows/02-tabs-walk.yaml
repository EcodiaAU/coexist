# Full tab-bar walk on the authed account. Anchors observed from the
# 2026-06-10 harvest screenshots (cxh-3 chat, cxh-4 profile, cxh-5 more).
# Ends inside the More drawer deliberately: closing it risks tapping
# "Admin Home" through the overlay; the next flow relaunches anyway.
appId: org.coexistaus.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: false
    stopApp: true
# Self-heal for 1b1e718d (see 01 flow); strict canary remains 90-.
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      notVisible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    commands:
      - stopApp
      - launchApp:
          clearState: false
- extendedWaitUntil:
    visible: ".*(YOUR NEXT EVENT|COMING UP IN YOUR COLLECTIVE|No events on your calendar).*"
    timeout: 30000
- tapOn: ".*Chat.*"
- extendedWaitUntil:
    visible: ".*Type a message.*"
    timeout: 15000
- tapOn: ".*Profile.*"
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 15000
# "EVENTS" was a profile stat label that the profile redesign removed (the page
# now leads with Edit Profile / Tickets / Donations / Settings then "YOUR IMPACT
# MAP", verified 2026-08-18 hw-GPU render). Assert "Donations", an always-present
# profile action button, as the fixture-independent anchor instead.
- assertVisible: "Tickets"
- assertVisible: ".*Member since.*"
- assertVisible: "Donations"
- tapOn: ".*More.*"
- extendedWaitUntil:
    visible: "Admin Home"
    timeout: 10000
- assertVisible: "Collectives"
- assertVisible: "Users"
- assertVisible: "Tasks"
- takeScreenshot: /tmp/maestro-cx-tabs-final
